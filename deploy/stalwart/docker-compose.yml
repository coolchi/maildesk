# Stalwart mail server for MailDesk (IMAP / POP / SMTP / JMAP)
#
# This compose is tuned for a Forge *app* host where nginx already owns :443
# and PHP may own :8080. Prefer a dedicated mail VPS for production MX.
#
# Quick start:
#   docker compose up -d
#   docker compose logs -f stalwart
#   Setup UI: http://127.0.0.1:18080/admin

services:
  stalwart:
    image: stalwartlabs/stalwart:v1
    container_name: maildesk-stalwart
    init: true
    restart: unless-stopped
    ports:
      # Inbound SMTP (MX) — needs free host port 25
      - "25:25"
      # Submission (implicit TLS)
      - "465:465"
      # Submission STARTTLS
      - "587:587"
      # IMAPS
      - "993:993"
      # POP3S
      - "995:995"
      # ManageSieve
      - "4190:4190"
      # HTTPS WebUI / JMAP — host 8443 (nginx already uses 443)
      - "8443:443"
      # Bootstrap / recovery HTTP — avoid host :8080 (often PHP)
      - "127.0.0.1:18080:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'X-Forwarded-For: 127.0.0.1' http://127.0.0.1:8080/healthz/live || curl -fsSk -H 'X-Forwarded-For: 127.0.0.1' https://127.0.0.1:443/healthz/live || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  stalwart-etc:
  stalwart-data:
